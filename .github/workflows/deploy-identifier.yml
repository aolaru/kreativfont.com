name: Deploy Font Identifier Plugin

on:
  push:
    branches: [main]
    paths:
      - 'scripts/identifier/**'
      - '.github/workflows/deploy-identifier.yml'
  pull_request:
    paths:
      - 'scripts/identifier/**'
      - '.github/workflows/deploy-identifier.yml'
  workflow_dispatch:

concurrency:
  group: deploy-identifier
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate plugin and exercise real multipart uploads with a mocked provider
        run: |
          find scripts/identifier -name '*.php' -print0 | xargs -0 -n 1 php -l
          find scripts/identifier/plugin/assets -name '*.js' -print0 | xargs -0 -n 1 node --check
          node scripts/identifier/tests/verify.cjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLUGIN_PATH: /htdocs/wp-content/plugins/kreativ-gpt-font-dentifier
    steps:
      - uses: actions/checkout@v4
      - name: Install transfer dependencies
        run: |
          timeout 5m sudo apt-get update -qq
          timeout 5m sudo apt-get install -y --no-install-recommends lftp
      - name: Back up the existing plugin before replacing anything
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PASSWORD: ${{ secrets.WP_SSH_PASSWORD }}
        run: |
          test -n "${WP_SSH_HOST}" && test -n "${WP_SSH_PORT}" && test -n "${WP_SSH_USER}" && test -n "${WP_SSH_PASSWORD}"
          mkdir -p identifier-backup/assets
          timeout 3m lftp -u "${WP_SSH_USER},${WP_SSH_PASSWORD}" \
            -e "set cmd:fail-exit yes; set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20; mirror --verbose=1 ${PLUGIN_PATH}/ identifier-backup/; bye" \
            "sftp://${WP_SSH_HOST}:${WP_SSH_PORT}"
          test -s identifier-backup/gpt-font-id.php
          test -s identifier-backup/admin-page.php
          test -s identifier-backup/assets/script.js
          test -s identifier-backup/assets/style.css
      - name: Preserve the rollback snapshot
        uses: actions/upload-artifact@v4
        with:
          name: identifier-before-${{ github.sha }}
          path: identifier-backup/
          retention-days: 90
          if-no-files-found: error
      - name: Deploy only the reviewed plugin files (privacy-safe backend first)
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PASSWORD: ${{ secrets.WP_SSH_PASSWORD }}
        run: |
          timeout 3m lftp -u "${WP_SSH_USER},${WP_SSH_PASSWORD}" \
            -e "set cmd:fail-exit yes; set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20; put scripts/identifier/plugin/catalogue.php -o ${PLUGIN_PATH}/catalogue.php; put scripts/identifier/plugin/assets/admin.js -o ${PLUGIN_PATH}/assets/admin.js; put scripts/identifier/plugin/gpt-font-id.php -o ${PLUGIN_PATH}/gpt-font-id.php; put scripts/identifier/plugin/admin-page.php -o ${PLUGIN_PATH}/admin-page.php; put scripts/identifier/plugin/assets/style.css -o ${PLUGIN_PATH}/assets/style.css; put scripts/identifier/plugin/assets/script.js -o ${PLUGIN_PATH}/assets/script.js; bye" \
            "sftp://${WP_SSH_HOST}:${WP_SSH_PORT}"
      - name: Verify the published frontend bytes
        run: |
          for asset in script.js style.css admin.js; do
            expected="$(sha256sum scripts/identifier/plugin/assets/${asset} | awk '{print $1}')"
            actual="$(curl --fail --silent --show-error --location --max-time 30 --retry 2 'https://kreativfont.com/wp-content/plugins/kreativ-gpt-font-dentifier/assets/'"${asset}?check=${GITHUB_SHA}" | sha256sum | awk '{print $1}')"
            test "${expected}" = "${actual}" || { echo "Asset verification failed: ${asset}"; exit 1; }
          done
