name: Deploy Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-theme-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WP_REMOTE_PATH: /htdocs/wp-content/themes/kreativfont.com/
      WP_ROOT_PATH: /htdocs/

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate theme
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n 1 php -l
          node --check assets/assets/components/init.js
          node --check js/kreativ-search-suggest.js
          node --check js/kreativ-share.js
          php -l scripts/audit-production.php

      - name: Validate deployment secrets
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PASSWORD: ${{ secrets.WP_SSH_PASSWORD }}
        run: |
          test -n "${WP_SSH_HOST}" || { echo "Missing WP_SSH_HOST"; exit 1; }
          test -n "${WP_SSH_PORT}" || { echo "Missing WP_SSH_PORT"; exit 1; }
          test -n "${WP_SSH_USER}" || { echo "Missing WP_SSH_USER"; exit 1; }
          test -n "${WP_SSH_PASSWORD}" || { echo "Missing WP_SSH_PASSWORD"; exit 1; }
          test -n "${WP_REMOTE_PATH}" || { echo "Missing WP_REMOTE_PATH"; exit 1; }
          test -n "${WP_ROOT_PATH}" || { echo "Missing WP_ROOT_PATH"; exit 1; }

      - name: Install deployment dependencies
        run: |
          timeout 5m sudo apt-get update -qq
          timeout 5m sudo apt-get install -y --no-install-recommends lftp php-curl php-xml

      - name: Deploy theme over SFTP
        env:
          WP_SSH_HOST: ${{ secrets.WP_SSH_HOST }}
          WP_SSH_PORT: ${{ secrets.WP_SSH_PORT }}
          WP_SSH_USER: ${{ secrets.WP_SSH_USER }}
          WP_SSH_PASSWORD: ${{ secrets.WP_SSH_PASSWORD }}
        run: |
          timeout --signal=TERM --kill-after=15s 5m lftp \
            -u "${WP_SSH_USER},${WP_SSH_PASSWORD}" \
            -e "set cmd:fail-exit yes; set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 20; set net:reconnect-interval-base 2; set net:reconnect-interval-max 8; mirror --reverse --verbose=1 --only-newer --exclude-glob .git/ --exclude-glob .git/** --exclude-glob .github/ --exclude-glob .github/** --exclude-glob scripts/ --exclude-glob scripts/** --exclude .gitignore --exclude README.md --exclude robots.txt ./ ${WP_REMOTE_PATH}; put robots.txt -o ${WP_ROOT_PATH}robots.txt; bye" \
            "sftp://${WP_SSH_HOST}:${WP_SSH_PORT}"

      - name: Verify deployed asset
        run: |
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors "https://kreativfont.com/wp-content/themes/kreativfont.com/assets/assets/components/init.js?deploy_check=${GITHUB_SHA}" \
            | grep -F '(function ($)'

      - name: Audit production
        run: timeout 12m php scripts/audit-production.php "https://kreativfont.com" "${GITHUB_SHA}"
